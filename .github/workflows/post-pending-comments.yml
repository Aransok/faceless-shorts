name: Post Pending CTA Comments

# Catches up on CTA comments that couldn't post at upload time. Real bug
# this exists to fix: post_cta_comment() used to fire immediately after
# upload, while a scheduled video is still private -- YouTube's API
# always rejects commentThreads.insert on a private video (confirmed for
# real: the identical call succeeds instantly once a video is actually
# public). Runs hourly and checks each pending video's REAL current
# privacyStatus rather than trusting our own stored schedule estimate.
# See pipeline/upload.py's post_pending_cta_comments() and ROADMAP.md.

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-pending-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Post pending CTA comments
        env:
          LLM_BACKEND: claude_code
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/post_pending_comments.py

      - name: Commit updated state
        run: |
          git config user.name "faceless-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.db
          if git diff --cached --quiet; then
            echo "no state changes to commit"
            exit 0
          fi
          git commit -m "Update state.db [skip ci]"

          for attempt in 1 2 3; do
            if git push; then
              echo "pushed state on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- rebasing onto latest main"
            git pull --rebase
          done

          echo "state push failed after 3 attempts"
          exit 1
