name: Daily Shorts

# Runs the full pipeline (script -> voice -> visuals -> assemble ->
# captions -> metadata -> upload) end to end, so it doesn't depend on the
# owner's laptop being on. See SPEC.md's "Scheduling & execution" and
# ROADMAP.md Phase 9/10.
#
# REQUIRE_REVIEW=false here is intentional and CI-specific: with no
# interactive terminal to run scripts/review.py, videos upload straight
# through as UPLOAD_VISIBILITY=private instead of stopping at
# awaiting_review — the owner reviews on YouTube itself and flips a video
# public from YouTube Studio once satisfied. Local/manual runs keep
# REQUIRE_REVIEW=true in .env for the interactive review queue.

on:
  schedule:
    # :07 past the hour, not :00 -- GitHub's own docs warn that scheduled
    # workflows are most likely to be delayed "at the start of every
    # hour" since that's when the global queue is busiest across every
    # repo on GitHub. Confirmed for real: this cron sat 7+ minutes past
    # its nominal 14:00 UTC fire time with zero run, on a brand-new repo
    # with no other explanation (Actions enabled, workflow registered
    # well before the slot, YAML valid). Off-the-hour minutes queue
    # behind far less contention.
    - cron: "7 14 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Number of new videos to generate (ignored if templates is set)"
        required: false
        default: "5"
      templates:
        description: "Optional: exact comma-separated template sequence to run instead of count (e.g. 'sauce_recipe,sauce_recipe')"
        required: false
        default: ""
      topic_hints:
        description: 'Optional: JSON object mapping template -> a specific real topic/angle to steer that new video onto, e.g. {"facts": "the bone collector caterpillar"}. Only applies to new videos, not resumed ones.'
        required: false
        default: ""

permissions:
  contents: write

# Real incident (2026-09-12): this workflow and Sync Analytics both got
# triggered within seconds of each other, and both write state.db.
# Sync Analytics pushed first; this run's own 20-minute-later push was
# rejected, and `git pull --rebase` can't auto-resolve a binary-file
# conflict (state.db is SQLite, not text) -- it just aborts, so the
# ENTIRE run's state changes were silently lost, including a real
# YouTube upload that happened during the run (the video stayed live,
# but the pipeline's own record of it never got committed). The retry
# loop below was built for "another push landed, replay mine on top,"
# not "the other push touched the exact same binary file" -- those are
# a different failure mode with no auto-merge possible. Sharing one
# concurrency group across every workflow that writes state.db (see the
# matching block in sync-analytics.yml, weekly-quiz.yml,
# post-pending-comments.yml, weekly-stats.yml) queues them to run
# strictly one at a time instead of racing, which is the actual fix --
# not a smarter retry, since there's no correct way to auto-merge two
# independent binary edits after the fact.
concurrency:
  group: faceless-shorts-state-writer

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        # `apt-get update` is allowed to fail non-fatally here: a real
        # scheduled run (2026-09-09) died at this exact step because the
        # runner image's pre-baked Google Chrome apt source had a
        # transient upstream hash mismatch on ITS OWN index -- nothing
        # to do with this project or ffmpeg, but the old `&&`-chained
        # command meant one unrelated broken repo aborted the whole
        # step (and skipped the entire pipeline run behind it). ffmpeg
        # itself comes from the regular Ubuntu archive mirrors, which
        # fetched fine in that same failed run -- only the Chrome repo's
        # index failed -- so tolerating apt-get update's exit code and
        # still attempting the install is the correct fix, not papering
        # over a real ffmpeg problem.
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run daily pipeline
        env:
          LLM_BACKEND: claude_code
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # If today's Claude usage limit is hit mid-run, retry that one
          # call on Groq's free-tier Llama API instead of failing the
          # video outright (see pipeline/plan.py's call_llm()). A no-op
          # until GROQ_API_KEY is actually added as a repo secret --
          # empty GROQ_API_KEY just makes the fallback attempt itself
          # fail too, same end result as not having one.
          LLM_FALLBACK_BACKEND: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TTS_BACKEND: edge_tts
          FACTS_VISUAL_SOURCE: stock
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REQUIRE_REVIEW: "false"
          UPLOAD_VISIBILITY: scheduled
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TOPIC_HINTS_JSON: ${{ github.event.inputs.topic_hints || '' }}
        run: >
          python scripts/run_daily.py
          --count "${{ github.event.inputs.count || '5' }}"
          --templates "${{ github.event.inputs.templates || '' }}"

      # assets/output/* is gitignored (rendered audio/video never gets
      # committed — the runner's filesystem is thrown away after the job
      # ends regardless). Only state.db and the upload-tracking log are
      # small enough, and worth persisting, to commit back.
      - name: Commit updated state
        run: |
          git config user.name "faceless-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.db data/videos.json data/phrase_usage.json data/thumbnails.json
          if git diff --cached --quiet; then
            echo "no state changes to commit"
            exit 0
          fi
          git commit -m "Update state.db [skip ci]"

          # A concurrent push (another run, or a manual push) landing on
          # main mid-job rejects this push with a stale-parent error --
          # this already happened once for real and silently dropped a
          # completed upload's state.db record (see ROADMAP.md). Rebase
          # onto whatever's actually on main and retry instead of losing
          # the commit when the runner is torn down.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed state on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- rebasing onto latest main"
            git pull --rebase
          done

          echo "state push failed after 3 attempts"
          exit 1
