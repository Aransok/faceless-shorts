name: Weekly Stats Report

# Pulls real view/like/comment counts for videos uploaded in the past 7
# days and ranks them by approach — the payoff of the approach-rotation
# A/B testing system built in Phase 6. See ROADMAP.md Phase 10 #4. Stays
# on the free Data API quota (videos.list with part=statistics), no
# YouTube Analytics OAuth scope.

on:
  schedule:
    # :07 past the hour, not :00 -- see daily-shorts.yml's comment for
    # why (GitHub's documented top-of-hour scheduling congestion,
    # confirmed for real on this repo).
    - cron: "7 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly report
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/weekly_report.py

      - name: Commit report
        run: |
          git config user.name "faceless-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "no report changes to commit"
            exit 0
          fi
          git commit -m "Weekly stats report [skip ci]"

          # Same push-race protection as daily-shorts.yml/weekly-quiz.yml
          # -- rebase onto latest main and retry rather than lose the
          # report if another workflow pushed state.db in the meantime.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed report on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- rebasing onto latest main"
            git pull --rebase
          done

          echo "report push failed after 3 attempts"
          exit 1
