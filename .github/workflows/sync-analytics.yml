name: Sync Analytics

# Pulls real view/like/comment counts for uploaded videos in a 48h-14d
# age window and persists them into state.db. Data collection only --
# no scoring/weighting/feedback logic reads these yet, see ROADMAP.md.
# Stays on the free Data API quota (videos.list with part=statistics).

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      debug_retention_curve_video_id:
        description: "Optional: a real YouTube video ID to print pipeline/stats.py's fetch_retention_curve() for (manual diagnostic only, no effect on the normal sync above)"
        required: false
        default: ""

permissions:
  contents: write

# Shares one concurrency group with every other workflow that writes
# state.db (daily-shorts.yml, weekly-quiz.yml, post-pending-comments.yml,
# weekly-stats.yml) so they queue strictly one at a time instead of
# racing -- see daily-shorts.yml's comment for the real 2026-09-12
# incident (this workflow's own push collided with daily-shorts.yml's
# 20-minute-later one and silently lost that run's state changes,
# including a real completed upload) that this fixes.
concurrency:
  group: faceless-shorts-state-writer

jobs:
  sync-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Sync analytics
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/sync_analytics.py

      # Manual diagnostic only -- only runs when the input above is set
      # on a workflow_dispatch run, never on the daily schedule. Prints
      # pipeline/stats.py's fetch_retention_curve() (see its module
      # docstring/__main__ block) for one real video, to see WHERE in a
      # video viewers actually leave, not just the average % watched.
      - name: Debug retention curve (optional)
        if: github.event.inputs.debug_retention_curve_video_id != ''
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python pipeline/stats.py "${{ github.event.inputs.debug_retention_curve_video_id }}"

      - name: Commit updated state
        run: |
          git config user.name "faceless-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.db
          if git diff --cached --quiet; then
            echo "no state changes to commit"
            exit 0
          fi
          git commit -m "Update state.db [skip ci]"

          for attempt in 1 2 3; do
            if git push; then
              echo "pushed state on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt/3) -- rebasing onto latest main"
            # A genuine content conflict (not just a stale parent) leaves
            # the repo stuck mid-rebase -- every later attempt in this loop
            # would then fail identically without this. Real incident
            # 2026-09-13: a rebase conflict on data/phrase_usage.json left
            # the repo mid-rebase after attempt 1, silently dooming attempts
            # 2-3 too. Abort back to a clean state so each attempt gets a
            # real chance against whatever is on main by then.
            git pull --rebase || git rebase --abort
          done

          echo "state push failed after 3 attempts"
          exit 1
