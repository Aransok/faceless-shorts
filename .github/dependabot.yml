# Keeps the SHA-pinned actions in .github/workflows up to date: Dependabot opens
# one grouped PR a month that bumps each pin and its "# vX.Y.Z" comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait a week after a release before proposing it: hijacked releases are
    # usually caught and pulled within days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
