# Pools of hook-opener / structure / phrasing variants per approach.
# plan.py picks one combination at random per video from the current
# approach's pool (config.yaml's current_approach), preferring phrases
# NOT used in the last 15 videos (see pipeline/approaches.py's recent-
# phrase exclusion) — so a week of videos under the same approach still
# varies script to script instead of reading as 2-3 rotating phrases.
# That variety is also what YouTube's inauthentic-content policy is
# checking for.

storytelling_hook:
  # Every hook_opener here must be a REACTION/STANCE ("this took me by
  # surprise", "I didn't believe it"), never a claimed SPECIFIC INCIDENT
  # ("the time this went wrong", "someone told me this once") — the
  # latter is a fabricated-personal-experience claim on a fully automated
  # channel, not just a style choice (see persona.md's "No fabricated
  # personal experience" rule). Real bug this fixed: "Here's the story
  # nobody warned me about" was a literal entry here, picked verbatim
  # into a real published script — the persona.md rule alone couldn't
  # override an approach pool directly contradicting it.
  #
  # Phase 17 follow-up, also confirmed real (not guessed): after
  # persona.md's rules got stricter about generic "empty enthusiasm"
  # phrasing, several entries here were themselves that exact pattern
  # ("sounds fake right up until it doesn't", "gets weirder the longer
  # you sit with it", "buckle up", "stay with me", "the detail that makes
  # this whole thing make sense") — real end-to-end runs got rejected by
  # the new authenticity review pass on lines picked VERBATIM from this
  # pool, same failure mode as the fabricated-experience bug above, just
  # a different rule. Rewrote every entry that promised excitement
  # without content; kept the ones that promise something real and
  # specific (an explanation, a corrected misconception).
  #
  # Phase 19 follow-up, real again: a subsequent real daily run failed
  # review on TWO of the entries kept above ("Most people get the story
  # behind this completely wrong:", "Here's the part of this story most
  # explanations skip:") for the exact same reason -- still generic/
  # topic-swappable despite promising something real. Individually
  # rewording pool entries doesn't fully fix this: a pool of reusable
  # phrases is generic by construction. Fixed at the actual root instead
  # -- pipeline/approaches.py's style_guidance_block() now explicitly
  # tells the model these are a tone/rhythm reference, never text to
  # insert, whichever entry gets picked.
  hook_openers:
    - "There's a real reason this is true, and it's not what you'd guess:"
    - "Most people get the story behind this completely wrong:"
    - "Here's the part of this story most explanations skip:"
    - "Nobody explains why this is actually true, so here goes:"
    - "This one holds up, and the reason why is the actual point:"
    - "The explanation for this usually gets left out entirely:"
    - "This is true for a specific, checkable reason, not just 'because':"
    - "Most versions of this story skip the actual cause:"
    - "This isn't the explanation most people settle for:"
    - "The reason this happens rarely makes it into the retelling:"
    - "This fact is real — the mechanism behind it almost never gets mentioned:"
    - "Most retellings of this leave out the actual reason it happens:"
    - "The real cause here gets simplified out of most versions of the story:"
    - "Here's the reasoning behind this that usually gets cut:"
    - "This is accurate, and the actual mechanism is worth knowing:"
    - "What usually gets skipped here is the actual why:"
    - "The full explanation for this rarely makes the cut:"
    - "This is real, and the reason is more specific than most people assume:"
  script_structures:
    - "Cold open on the surprising moment, then unpack how we got there."
    - "Set up the ordinary situation, then reveal the twist, then land the payoff."
    - "Start in the middle of the action, then rewind to explain."
    - "Build tension gradually across three beats, then release it in the last line."
    - "Open with the outcome, then walk backward through the cause."
    - "Frame it as a mystery, then solve it by the end."
    - "Introduce the normal expectation, then subvert it hard."
    - "Tell it like a story you'd tell a friend at dinner — setup, complication, punchline."
    - "Lead with a question the story answers by the end."
    - "Use a slow build with one big reveal near the very end."
    - "Open on a small detail, then zoom out to the bigger picture."
    - "Contrast what you'd expect against what actually happened."
    - "Structure it as three escalating moments, biggest last."
    - "Start with the punchline, then explain why it's true."
    - "Walk through it in real time, like you're narrating it as it unfolds."
    - "Set expectations early, then flip them in the back half."
    - "Open with a confession, then explain what led to it."
    - "Build toward an 'and that's when it got weird' turn."
  phrasing_styles:
    - "Conversational, like explaining it to a friend over coffee."
    - "Slightly dramatic — build a little tension before the reveal."
    - "Warm and a little self-deprecating."
    - "Curious and searching, like you're figuring it out as you go."
    - "Confident storyteller voice — you already know how this ends and you're enjoying the telling."
    - "A little breathless, like you can't wait to get to the good part."
    - "Reflective, like you're still a little surprised by it yourself."
    - "Casual but precise — no filler, but still sounds like a real conversation."
    - "Warm humor threaded through, without undercutting the actual point."
    - "Earnest, like you genuinely want the listener to feel what you felt."
    - "Slightly conspiratorial, like you're letting them in on something."
    - "Plainspoken but with real conviction underneath it."
    - "Unhurried — let the details breathe before moving on."
    - "A little wry, noticing the absurdity without overplaying it."
    - "Direct eye-contact energy — like you're talking straight to one person."
    - "Building excitement that peaks right at the reveal."
    - "Grounded and matter-of-fact, letting the story's own weirdness do the work."
    - "Intimate, like sharing something you don't tell everyone."

