    - "Energetic without being shouty."
    - "Confident and quick, like you already know this lands."
    - "Punch each key word slightly — cadence matters here."
    - "No filler words at all — 'um', 'like', 'basically' banned."
    - "Talk like you're genuinely in a hurry to tell someone."
    - "Bright and quick, almost a little breathless."
    - "Staccato rhythm — short bursts, clear breaks."
    - "Matter-of-fact but fast, like reading a highlight reel."
    - "Snappy, with a little grin in the delivery."
    - "Urgent but controlled — fast doesn't mean sloppy."
    - "Each sentence lands like its own mic drop."
    - "Quick with a wink — this is fun, not frantic."
    - "Efficient enthusiasm — excited, but not wasting time on it."
    - "Rapid cadence, but land the final word hard."

deadpan_facts:
  hook_openers:
    - "So, this is real:"
    - "Nobody asked, but here's a fact anyway:"
    - "This is objectively true, and a little upsetting:"
    - "Here's a fact you didn't need, but now have:"
    - "This is real. Unfortunately."
    - "Fun fact, if 'fun' is the word:"
    - "Here's something true that shouldn't be:"
    - "This checks out, somehow:"
    - "A fact, delivered without enthusiasm:"
    - "Here's something the universe decided was fine:"
    - "This is apparently how things are:"
    - "No context needed, just the fact:"
    - "This is real and nobody's stopped it:"
    - "Here's a fact. That's it. That's the post."
    - "This is true, which is somehow worse:"
    - "Presented without comment:"
    - "A fact nobody asked for, delivered anyway:"
    - "This exists, for some reason:"
  script_structures:
    - "Flat, matter-of-fact delivery of the fact, then one dry aside."
    - "State it plainly, then undercut it with a wry observation."
    - "Deliver the fact with zero emphasis, let the absurdity carry itself."
    - "State it, pause, then one deadpan comment to close."
    - "Present it like a news anchor reading something mildly unfortunate."
    - "No excitement anywhere — let the fact do all the work."
    - "State the fact, then one flat 'and that's just how it is'-style line."
    - "Treat something absurd with complete seriousness."
    - "Deliver it like you're reading a very boring report about something insane."
    - "One flat statement, one flatter reaction."
    - "Present it as if it's the most normal thing in the world."
    - "State it, then let a single dry aside land the joke."
    - "No buildup, no reaction — just fact, then silence, then a dry tag line."
    - "Read it like you've already accepted this is reality."
    - "Deliver the absurd fact and the mundane aside with equal flatness."
    - "State it once, plainly, then close with quiet resignation."
    - "Present the fact as an inconvenience you're just now mentioning."
    - "Undersell it completely, then let the fact overperform on its own."
  phrasing_styles:
    - "Dry and understated — let the fact itself carry the weight."
    - "Deadpan, almost bored delivery, contrasted against a wild fact."
    - "Completely flat affect, like reading a grocery list."
    - "No inflection changes — same tone for the wildest and the mildest detail."
    - "Bone dry, with the faintest hint of exasperation."
    - "Monotone but not robotic — still human, just unimpressed."
    - "Delivered like you've stopped being surprised by anything."
    - "Quiet resignation running underneath every line."
    - "Understated to the point of sounding unbothered."
    - "As if narrating something mildly annoying, not remarkable."
    - "Completely straight-faced, letting the words do all the work."
    - "Tired but precise — like you've explained this before."
    - "Minimal emotional range, maximal comedic timing."
    - "Delivered like a warning label — factual, slightly ominous."
    - "So flat it loops back around to funny."
    - "No excitement allowed, on principle."
    - "Reads it like it's obvious, even though it very much isn't."
    - "Completely unbothered, bordering on unimpressed."
